name: Validar dropXL eBay Europa
on:
  push:
    branches: [dropxl-ebay-europa]
    paths: ['dropxl-ebay-europa/**', '.github/workflows/dropxl-ebay-ci.yml']
  pull_request:
    paths: ['dropxl-ebay-europa/**', '.github/workflows/dropxl-ebay-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dropxl-ebay-europa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python bridge.py demo
